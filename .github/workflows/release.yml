name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar Keystore de Assinatura
        run: |
          mkdir -p "$RUNNER_TEMP"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ciclo.jks"

      - name: Testes e Build Release Assinado
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ciclo.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease

      - name: Publicar Release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          APK_NAME="Ciclo-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          
          # Extrai a mensagem completa do último commit que disparou a release
          git log -1 --pretty=%B > release_notes.txt
          
          gh release create "v${VERSION}" "$APK_NAME" \
            --title "Ciclo v${VERSION}" \
            --notes-file release_notes.txt \
            --latest
